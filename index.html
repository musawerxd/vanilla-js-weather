<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla js Weather App 🌤️</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">

</head>

<body class="">
  <script>
    const savedTheme = localStorage.getItem("theme")
    if (savedTheme === "dark") {
      document.body.classList.add("dark");
    }
    </script>
  <nav>
    <button id="musawerxd">
      <img src="images/linkedin.webp" alt="musawerxd">
      <p>Built by musawerxd</p>
    </button>

    <div class="navRight">
      <button id="theme">🌙 Dark Mode</button>
    </div>
  </nav>

  <main class="container">

    <div class="search-section">
      <input type="text" id="city-input" placeholder="Search for a city... (e.g., Multan)">
      <button id="search-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <div class="weather-card">
      <div class="card-header">
        <h1 class="city-name"></h1>
        <p class="current-date"></p>
      </div>

      <div class="card-body">
        <div class="weather-icon">☀️</div>
        <div class="temperature"></div>
        <p class="weather-desc"></p>
      </div>

      <div class="card-footer">
        <div class="extra-info">
          <span class="info-label">Humidity</span>
          <span class="info-value" id="humidity"></span>
        </div>
        <div class="extra-info">
          <span class="info-label">Wind</span>
          <span class="info-value" id="wind"></span>
        </div>
        <div class="extra-info">
          <span class="info-label">Feels Like</span>
          <span class="info-value" id="feelLike"></span>
        </div>
      </div>
    </div>

  </main>

</body>

</html>
